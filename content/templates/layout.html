<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="bare">
  <title>{{title}} · bare</title>
  <style>
    :root {
      --bg: #fdfdfc;
      --fg: #1f2328;
      --muted: #6b7280;
      --accent: #b4532a;
      --rule: #e7e5e4;
      --code-bg: #f4f3f1;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --fg: #e7e5e4;
        --muted: #9ca3af;
        --accent: #f08a5d;
        --rule: #2e2e2e;
        --code-bg: #222;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.75 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    .wrap { max-width: 42rem; margin: 0 auto; padding: 0 1.25rem; }
    .site-header { border-bottom: 1px solid var(--rule); }
    .site-header .wrap { display: flex; justify-content: space-between; align-items: baseline; padding-block: 1.25rem; }
    .brand { font-weight: 700; letter-spacing: -0.02em; color: var(--fg); text-decoration: none; font-size: 1.15rem; }
    .tagline { color: var(--muted); font-size: 0.85rem; }
    main { padding-block: 2.5rem 4rem; }
    a { color: var(--accent); text-underline-offset: 0.2em; }
    h1, h2, h3 { line-height: 1.3; letter-spacing: -0.01em; }
    h1 { font-size: 1.9rem; margin: 0 0 0.5rem; }
    h2 { font-size: 1.35rem; margin: 2.5rem 0 0.75rem; }
    h3 { font-size: 1.1rem; margin: 2rem 0 0.5rem; }
    code { font-family: var(--mono); font-size: 0.88em; background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
    pre { background: var(--code-bg); padding: 1rem 1.15rem; border-radius: 8px; overflow-x: auto; line-height: 1.55; }
    pre code { background: none; padding: 0; font-size: 0.85rem; }
    ul { padding-left: 1.25rem; }
    .meta { color: var(--muted); font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin: 0; }
    .tags { list-style: none; padding: 0; margin: 0; display: inline-flex; flex-wrap: wrap; gap: 0.4rem; }
    .tag { font-size: 0.75rem; border: 1px solid var(--rule); border-radius: 999px; padding: 0 0.6rem; color: var(--muted); }
    .post-header { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--rule); }
    .post-list { list-style: none; padding: 0; margin: 0; }
    .post-item { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.25rem 1rem; padding: 1rem 0; border-bottom: 1px solid var(--rule); }
    .post-item time { color: var(--muted); font-family: var(--mono); font-size: 0.85rem; padding-top: 0.15rem; }
    .post-item a { font-weight: 600; text-decoration: none; }
    .post-item a:hover { text-decoration: underline; }
    .post-item .tags { grid-column: 2; }
    .back { margin-top: 3rem; }
    .site-footer { border-top: 1px solid var(--rule); color: var(--muted); font-size: 0.8rem; }
    .site-footer .wrap { padding-block: 1.5rem; }
    @media (max-width: 480px) {
      .post-item { grid-template-columns: 1fr; }
      .post-item .tags { grid-column: 1; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{root}}index.html">bare</a>
      <span class="tagline">std only. nothing else.</span>
    </div>
  </header>
  <main class="wrap">
{{content}}
  </main>
  <footer class="site-footer">
    <div class="wrap">Generated by bare — a zero-dependency static site generator.</div>
  </footer>
</body>
</html>
