<!doctype html>
<html lang="{{site_lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="bare">
  <meta name="author" content="{{site_author}}">
  <title>{{page_title}}</title>
  {{meta}}
  <link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{root}}css/style.css">
  <link rel="stylesheet" href="{{root}}css/custom.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{root}}index.html">{{site_title}}</a>
      <span class="tagline">{{site_description}}</span>
    </div>
  </header>
  <main id="main" class="site-main wrap">
{{content}}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>{{site_title}}</span>
      <span>Built with <a href="https://github.com/Nagatani/bare">bare</a> — fork it and start your own blog.</span>
    </div>
  </footer>
</body>
</html>
