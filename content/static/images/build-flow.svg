<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" font-family="system-ui, sans-serif" font-size="15">
  <style>
    .box { fill: #f3f5f7; stroke: #dfe3e8; }
    .core { fill: #0645ad; }
    .label { fill: #1f2328; }
    .sub { fill: #59636e; font-size: 12px; }
    .arrow { stroke: #9ba4ae; stroke-width: 2; fill: none; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1d2025; stroke: #2d3239; }
      .core { fill: #2f63c4; }
      .label { fill: #e3e6ea; }
      .sub { fill: #9ba4ae; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9ba4ae"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="40" width="170" height="80" rx="10"/>
  <text class="label" x="95" y="76" text-anchor="middle">content/</text>
  <text class="sub" x="95" y="98" text-anchor="middle">posts · themes · static</text>
  <path class="arrow" d="M186 80H244" marker-end="url(#head)"/>
  <rect class="core" x="250" y="40" width="140" height="80" rx="10"/>
  <text x="320" y="76" text-anchor="middle" fill="#fff" font-weight="700">bare</text>
  <text x="320" y="98" text-anchor="middle" fill="#fff" font-size="12">std only</text>
  <path class="arrow" d="M396 80H454" marker-end="url(#head)"/>
  <rect class="box" x="460" y="40" width="170" height="80" rx="10"/>
  <text class="label" x="545" y="76" text-anchor="middle">dist/</text>
  <text class="sub" x="545" y="98" text-anchor="middle">GitHub Pages へ公開</text>
</svg>
