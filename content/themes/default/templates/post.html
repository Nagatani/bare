<article>
  <header class="post-header">
    <h1>{{title}}</h1>
    <p class="lead">{{description}}</p>
    <div class="meta"><time datetime="{{date}}">{{date}}</time><span>約 {{reading_minutes}} 分で読めます</span>{{tags}}</div>
  </header>
  <details class="toc-box" open><summary>目次</summary>{{toc}}</details>
  <div class="post-body prose">
{{content}}
  </div>
  <p class="back"><a href="{{root}}"><span aria-hidden="true">←</span> 記事一覧へ戻る</a></p>
</article>
