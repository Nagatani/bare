# Build the site with bare and publish dist/ to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish, but skip queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Fail fast with an actionable message instead of configure-pages' "Not Found".
      - name: Check GitHub Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=GitHub Pages is not set up::Open Settings → Pages → Build and deployment and set Source to \"GitHub Actions\", then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/**') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Test
        run: cargo test --locked

      # OGP images are rendered by the runner's Google Chrome. Japanese titles
      # need a Japanese font, which the runner image may not include.
      - name: Install Japanese font for OGP images
        run: |
          if ! fc-list :lang=ja | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fi

      # Keep rendered OGP images between runs, so only changed posts launch Chrome.
      - name: Cache OGP images
        uses: actions/cache@v6
        with:
          path: target/bare-og
          key: og-${{ runner.os }}-${{ hashFiles('content/**') }}
          restore-keys: og-${{ runner.os }}-

      # Provides the public URL (including custom domains) as base_url.
      - id: pages
        uses: actions/configure-pages@v6

      # `check` builds the site and fails on broken links, so a broken blog is never deployed.
      - name: Build and check site
        run: cargo run --release --locked -- check --clean --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Keep dotfiles copied from content/static/ (e.g. .well-known/).
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
